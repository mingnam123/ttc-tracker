<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA Transit Live Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #panel { position: absolute; top: 12px; left: 12px; z-index: 1; background: rgba(20,24,30,.92);
           color: #fff; padding: 12px; border-radius: 10px; width: 230px; font-size: 13px; }
  #panel h1 { font-size: 15px; margin: 0 0 8px; }
  #panel input, #panel select, #panel button { width: 100%; box-sizing: border-box; margin-top: 6px;
           padding: 6px; border-radius: 6px; border: 0; font-size: 13px; }
  #panel button { background: #da291c; color: #fff; cursor: pointer; }
  #stat, #rname { margin-top: 8px; color: #aab; }
  #rname { color: #fff; font-weight: 600; white-space: pre-line; }
  #legend div { margin-top: 3px; }
  .scard .maplibregl-popup-content { padding: 0; border-radius: 12px; overflow: hidden; min-width: 240px; box-shadow: 0 4px 18px rgba(0,0,0,.3); font-size: 12.5px; color: #223; }
  .scard .hd { padding: 10px 12px 8px; background: #20262e; color: #fff; }
  .scard .hd b { display: block; font-size: 14px; padding-right: 14px; }
  .scard .hd span { color: #aab; font-size: 11.5px; }
  .scard .bd2 { max-height: 300px; overflow: auto; padding: 4px 0; }
  .scard .rr { padding: 6px 12px; border-top: 1px solid #eef0f3; }
  .scard .rr:first-child { border-top: 0; }
  .scard .rbtn { border: 0; border-radius: 5px; padding: 1px 7px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .scard .rl { margin-left: 6px; color: #556; }
  .scard .dr { margin: 3px 0 0 2px; color: #223; display: flex; gap: 6px; }
  .scard .dr i { font-style: normal; color: #889; min-width: 22px; font-size: 11px; }
  .scard .ft { padding: 6px 12px 8px; color: #889; font-size: 11px; border-top: 1px solid #eef0f3; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .phead h1 { margin: 0 !important; }
  #panel .phead button { width: 26px; height: 26px; margin: 0; padding: 0; background: #2f3742; font-size: 16px; line-height: 1; flex: none; }
  #panel.collapsed { width: auto; padding: 8px 10px; }
  #panel.collapsed > :not(.phead) { display: none !important; }
  #panel.collapsed h1 { font-size: 13px; }
  #nearBtn { position: absolute; left: 12px; bottom: 28px; z-index: 2; padding: 9px 14px; border: 0; border-radius: 20px; background: rgba(20,24,30,.94); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  #nearBtn:hover { background: #2f3742; }
  #nearBox { position: absolute; left: 12px; bottom: 76px; z-index: 1; width: 310px; max-height: calc(100vh - 220px); overflow: auto; padding: 10px 12px; background: rgba(20,24,30,.94); border-radius: 10px; font-size: 12.5px; color: #cdd; display: none; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #nearBox .nx { float: right; background: none; border: 0; color: #99a; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
  #nearBox .rt { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 4px; padding: 4px 6px; background: #232a33; border: 0; border-radius: 6px; color: #fff; font-size: 12px; text-align: left; cursor: pointer; }
  #nearBox .rt:hover { background: #2f3742; }
  #nearBox .rt .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nearBox .rt { flex-wrap: wrap; row-gap: 1px; }
  #nearBox .rt small { color: #99a; flex-basis: 100%; }
  #nearBox .bd { padding: 1px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; color: #fff; }
  #nearBox b { color: #fff; }
  #nearBox .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; max-height: 96px; overflow: auto; }
  #nearBox .chips button { width: auto; margin: 0; padding: 2px 7px; font-size: 11px; background: #2f3742; border-radius: 10px; }
  #nearBox select { width: auto; margin: 0 0 0 6px; padding: 2px; font-size: 12px; }
  .vcard .maplibregl-popup-content { padding: 0; border-radius: 12px; overflow: hidden; min-width: 220px;
           box-shadow: 0 4px 18px rgba(0,0,0,.3); font-size: 12.5px; color: #223; }
  .vcard .maplibregl-popup-close-button { color: #fff; font-size: 18px; right: 4px; top: 4px; background: rgba(0,0,0,.28);
           border-radius: 50%; width: 22px; height: 22px; line-height: 20px; padding: 0; }
  .vcard .hd { padding: 9px 34px 9px 12px; color: #fff; font-weight: 700; font-size: 14px; }
  .vcard .bd { padding: 8px 12px 10px; background: #fff; }
  .vcard .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  .vcard .row b { font-weight: 600; } .vcard .row span { text-align: right; color: #445; }
  .vcard .badge { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  #alertModal { display: none; position: fixed; inset: 0; z-index: 5; background: rgba(10,15,20,.5); align-items: center; justify-content: center; padding: 16px; }
  #alertModal .sheet { background: #fff; color: #1f3a2d; border-radius: 18px; width: min(640px, 100%); max-height: 88vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #alertModal .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px; background: #eef4ef; border-radius: 18px 18px 0 0; }
  #alertModal .kicker { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #a3281e; }
  #alertModal h2 { margin: 2px 0 0; font-size: 20px; } #alertModal h3 { margin: 10px 0 6px; font-size: 16px; }
  #alertModal .top button { border: 1px solid #ccd; background: #fff; border-radius: 20px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  #alertModal section { padding: 14px 18px; border-top: 1px solid #e6ece8; } #alertModal p { line-height: 1.45; font-size: 14px; }
  #alertModal .chips { display: flex; gap: 6px; flex-wrap: wrap; } #alertModal .chip { padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 700; }
  #alertModal .chip.a { background: #fbe4e2; color: #a3281e; } #alertModal .chip.b { background: #e3efe7; color: #2e6b4a; } #alertModal .chip.c { background: #2e6b4a; color: #fff; }
  #alertModal .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f1f6f2; border-radius: 12px; padding: 12px; font-size: 13px; }
  #alertModal .facts b { display: block; font-size: 11px; text-transform: uppercase; color: #667; }
  #alertModal .more { display: inline-block; margin-top: 12px; background: #2e6b4a; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 700; text-decoration: none; }
  #alertModal .src { padding: 10px 18px; font-size: 11px; color: #778; border-top: 1px solid #e6ece8; }
  #runpanel { display: none; position: absolute; right: 12px; bottom: 30px; z-index: 2; width: min(350px, calc(100vw - 24px)); box-sizing: border-box;
              background: rgba(20,24,30,.95); color: #fff; border-radius: 12px; padding: 10px 12px 12px; font-size: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #runpanel h2 { margin: 0 24px 2px 0; font-size: 13px; } #runpanel .sub { color: #aab; margin-bottom: 6px; }
  #runpanel .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: #aab; font-size: 18px; cursor: pointer; }
  #runpanel .chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0 6px; }
  #runpanel .chips button { background: #2a313b; color: #dde; border: 0; border-radius: 10px; padding: 2px 8px; font-size: 11px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #runpanel .chips button.on { background: #1f8a4c; color: #fff; }
  #runpanel .big { font-size: 20px; font-weight: 700; } #runpanel .big small { font-size: 12px; font-weight: 400; color: #aab; }
  #runpanel .cap { color: #889; font-size: 10.5px; margin-top: 6px; } #runpanel .h { margin-top: 8px; color: #aab; font-weight: 600; }
  #runpanel svg { display: block; width: 100%; height: auto; } #runpanel #rtip { min-height: 15px; color: #cfd; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div id="panel">
  <div class="phead"><h1>GTA Transit Live Tracker</h1><button id="panelToggle" title="Collapse / expand panel" aria-label="Collapse panel">&minus;</button></div>
  <input id="route" list="routes" placeholder="Route or agency: TTC 504, YRT" title="Type an agency, a route, or both. TTC 504 = route 504 on TTC; YRT = every YRT vehicle; 29 = route 29 on either agency. Not case-sensitive.">
  <datalist id="routes"></datalist>
  <select id="color">
    <option value="type">Colour: vehicle type</option>
    <option value="delay">Colour: delay</option>
    <option value="crowd">Colour: crowding</option>
  </select>
  <label style="display:block;margin-top:8px;cursor:pointer" title="Estimated from how fast vehicles are moving on each stop-to-stop stretch"><input type="checkbox" id="traffic" style="width:auto;margin:0 6px 0 0;vertical-align:middle">Traffic estimate</label>
  <div id="trafficKey" style="display:none;margin:4px 0 0 22px;font-size:11.5px;color:#aab"><span style="color:#2fbf71">&#9632;</span> smooth &nbsp;<span style="color:#f5a623">&#9632;</span> slow &nbsp;<span style="color:#e5392b">&#9632;</span> heavy &nbsp;<span style="opacity:.6">(faded = still learning)</span><div id="trafficMsg" style="margin-top:2px"></div></div>
  <label style="display:block;margin-top:8px;cursor:pointer"><input type="checkbox" id="trails" checked style="width:auto;margin:0 6px 0 0;vertical-align:middle">Motion trails</label>
  <div style="margin-top:8px;display:flex;gap:14px">
    <label style="cursor:pointer"><input type="checkbox" id="showBus" checked style="width:auto;margin:0 6px 0 0;vertical-align:middle">Buses</label>
    <label style="cursor:pointer"><input type="checkbox" id="showTram" checked style="width:auto;margin:0 6px 0 0;vertical-align:middle">Streetcars</label>
  </div>
  <button id="mode">Switch to 3D</button>
  <div id="rname"></div>
  <div id="stat">Loading…</div>
  <div id="agencies" style="margin-top:4px;color:#aab;font-size:12px;white-space:pre-line"></div>
  <div id="dbg" style="margin-top:4px;color:#778;font-size:11px;white-space:pre-line"></div>
</div>
<div id="map"></div>
<button id="nearBtn" title="Zoom to your location and list the routes and vehicles nearby">&#9678; Zoom to my location</button>
<div id="nearBox"></div>

<div id="runpanel"></div>
<div id="alertModal"><div class="sheet"></div></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="models3d.js"></script>
<script>
const POLL_MS = 15000;
const GREY = '#8a8f98';
const PALETTES = {
  type: [['TTC streetcar', '#da291c'], ['TTC bus', '#2b8cff'], ['YRT bus', '#14b8a6'], ['GO', '#00a651'], ['Other', '#b0a0d0']],
  delay: [['Early (>1 min)', '#4aa8ff'], ['On time (≤2 min late)', '#2fbf71'], ['2–5 min late', '#f5a623'], ['>5 min late', '#e5392b'], ['No data', GREY]],
  crowd: [['Empty / many seats', '#2fbf71'], ['Few seats', '#e6d44a'], ['Standing room', '#f5a623'], ['Crushed / full', '#e5392b'], ['No data', GREY]],
};

const map = new maplibregl.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-79.38, 43.70], zoom: 11, antialias: true,
});
map.addControl(new maplibregl.NavigationControl());
map.on('error', e => console.error('map error:', e.error || e));

let shapesData = null, routes = {}, fq = null; // fq = parsed route filter {agency, short}
const vehicles = new Map(); // id -> {from,to,cur,bearing,route,speed,delay,occ,kind}
let lastUpdated = null, colorMode = 'type', is3D = false, ready = false, hasStatic = false;

const TRAIL_POINTS = 5, TRAIL_MS = 180000, MOVE_MIN_M = 8;
let trailsOn = true, tipFrame = 0;
const typeOn = { bus: true, streetcar: true };
let idTrust = {}; // agency -> do the feed's vehicle ids behave like fleet numbers? (see refresh)
const lerp = (a, b, t) => a + (b - a) * t;
const bearingBetween = (a, b) => (Math.atan2((b[0] - a[0]) * Math.cos(b[1] * Math.PI / 180), b[1] - a[1]) * 180 / Math.PI + 360) % 360;
const metres = (a, b) => Math.hypot((b[0] - a[0]) * 111320 * Math.cos(b[1] * Math.PI / 180), (b[1] - a[1]) * 111320);
const EMPTY = { type: 'FeatureCollection', features: [] };

// Older trail segments: rebuilt on each feed update (and every 5 s so expired points drop off).
// The newest segment (last history point -> live marker) is rebuilt every frame in render().
function rebuildHist() {
  const src = map.getSource('trail-hist');
  if (!src) return;
  if (!trailsOn) { src.setData(EMPTY); return; }
  const now = Date.now(), features = [];
  for (const v of vehicles.values()) {
    const live = v.hist.filter(p => now - p[2] < TRAIL_MS);
    v.m = live.length;
    if (!v.m || !matches(v)) continue;
    const color = colorOf(v);
    for (let j = 0; j < live.length - 1; j++)
      features.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[live[j][0], live[j][1]], [live[j + 1][0], live[j + 1][1]]] },
        properties: { color, a: 0.12 + 0.55 * (j + 1) / live.length } });
  }
  src.setData({ type: 'FeatureCollection', features });
}
let byShort = null;
const info = r => {
  if (routes[r]) return routes[r];
  if (!byShort) { byShort = {}; for (const x of Object.values(routes)) byShort[`${x.a}:${kOf(x)}`] ??= x; }
  const [ag, ...rest] = String(r ?? '').split(':');
  return byShort[`${ag}:${norm(rest.join(':'))}`] || (ag === 'TTC' || ag === 'YRT' ? routes[rest.join(':')] : null) || null; // last: older unprefixed routes.json
};
// Filter text: "TTC 504" / "ttc:504" -> that route; "yrt" -> whole agency; "504" -> that number on either agency.
function parseFilter(text) {
  const t = text.trim().toLowerCase();
  if (!t) return null;
  const m = t.match(/^(ttc|yrt)\s*[: ]?\s*(.*)$/);
  return m ? { agency: m[1].toUpperCase(), short: norm(m[2].trim()) } : { agency: null, short: norm(t) };
}
const norm = s => String(s).toLowerCase().replace(/^0+(?=\d)/, ''); // "001" -> "1"
const kOf = r => r.k ?? norm(r.s);
const shortOf = v => { const i = info(v.route); return i ? kOf(i) : norm(String(v.route).split(':').pop()); };
const matches = v => typeOn[v.kind] !== false && (!fq || ((!fq.agency || v.agency === fq.agency) && (!fq.short || shortOf(v) === fq.short)));
const kindOf = r => { const t = info(r)?.t; return t === '0' ? 'streetcar' : t === '3' || t == null ? 'bus' : 'other'; };

function colorOf(v) {
  if (colorMode === 'delay') {
    const d = v.delay;
    if (d == null) return GREY;
    return d < -60 ? '#4aa8ff' : d <= 120 ? '#2fbf71' : d <= 300 ? '#f5a623' : '#e5392b';
  }
  if (colorMode === 'crowd') {
    const o = v.occ;
    if (o == null || o > 5) return GREY;
    return o <= 1 ? '#2fbf71' : o === 2 ? '#e6d44a' : o === 3 ? '#f5a623' : '#e5392b';
  }
  return v.kind === 'streetcar' ? '#da291c' : v.agency === 'YRT' ? '#14b8a6' : v.agency === 'GO' ? '#00a651' : v.kind === 'bus' ? '#2b8cff' : '#b0a0d0';
}

const BUS_SVG = '<svg width="14" height="14" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:6px"><polygon points="24,3 40,42 24,33 8,42" fill="#ccd" stroke="#111" stroke-width="3"/></svg>';
const TRAM_SVG = '<svg width="14" height="14" viewBox="0 0 28 68" style="vertical-align:middle;margin-right:6px"><polygon points="14,2 25,15 25,66 3,66 3,15" fill="#ccd" stroke="#111" stroke-width="3"/><line x1="3" y1="38" x2="25" y2="38" stroke="#111" stroke-width="3"/></svg>';
function renderLegend() { /* legend removed from the panel */ }

function showAgencies(a) {
  if (!a) return;
  const lines = [Object.entries(a).map(([k, s]) => s.error ? `${k} ✗` : `${k} ${s.count}`).join(' · ')];
  for (const [k, s] of Object.entries(a)) if (s.error) lines.push(`${k}: ${String(s.error).slice(0, 90)}`);
  document.getElementById('agencies').textContent = lines.join('\n');
}

async function refresh() {
  try {
    const data = await (await fetch('/api/vehicles')).json();
    showAgencies(data.agencies);
    if (!data.updated) { document.getElementById('stat').textContent = data.error ? 'Server: ' + data.error : 'Waiting for live feeds…'; return; }
    if (data.updated === lastUpdated) return;
    lastUpdated = data.updated;
    const seen = new Set(), now = performance.now();
    // Type comes from vehicle.id (fleet number). Self-check: if an agency has streetcar ROUTES in the schedule data but not one
    // vehicle id says "streetcar", the ids probably aren't fleet numbers, so type that agency by route instead.
    const tally = {};
    for (const v of data.vehicles) { const s = (tally[v.agency] ??= { byId: 0, byRoute: 0 }); if (v.type === 'streetcar') s.byId++; if (kindOf(v.route) === 'streetcar') s.byRoute++; }
    idTrust = Object.fromEntries(Object.entries(tally).map(([a, s]) => [a, !(s.byRoute > 0 && s.byId === 0)]));
    for (const v of data.vehicles) {
      seen.add(v.id);
      const pos = [v.lon, v.lat], prev = vehicles.get(v.id);
      // Only restart a vehicle's glide when its target position actually changed (the two agencies update at different moments).
      const fresh = !prev || prev.to[0] !== pos[0] || prev.to[1] !== pos[1];
      let bearing = v.bearing; // YRT's feed has no bearing: derive it from movement, keep the last known one while parked
      if (bearing == null) {
        bearing = prev?.bearing ?? null;
        if (prev && metres(prev.to, pos) > MOVE_MIN_M) bearing = bearingBetween(prev.to, pos);
      }
      vehicles.set(v.id, {
        from: !prev ? pos : fresh ? prev.cur : prev.from, to: pos, cur: prev ? prev.cur : pos, t0: fresh ? now : prev.t0,
        hist: !prev ? [] : metres(prev.to, pos) > MOVE_MIN_M
          ? [...prev.hist, [prev.cur[0], prev.cur[1], Date.now()]].slice(-TRAIL_POINTS) : prev.hist,
        m: 0, agency: v.agency, trip: v.trip,
        bearing, route: v.route, speed: v.speed, delay: v.delay, occ: v.occ, model: v.model,
        kind: v.type && idTrust[v.agency] !== false ? v.type : kindOf(v.route) === 'streetcar' ? 'streetcar' : 'bus',
      });
    }
    for (const id of vehicles.keys()) if (!seen.has(id)) vehicles.delete(id);
    rebuildHist(); updateNearby();
    if (selId && card && vehicles.has(selId)) { card.setHTML(cardHTML(selId, vehicles.get(selId))); drawRun(); }
  } catch (e) { console.error(e); document.getElementById('stat').textContent = 'Cannot reach /api/vehicles – is the server running?'; }
}

// ---- 3D vehicle models (3D mode only): extruded boxes built from real vehicle dimensions ----
// Each vehicle becomes a few stacked parts: body, recessed dark window band, roof, a yellow destination sign at the
// FRONT, and for long vehicles articulated sections with a dark joint (streetcar: plus a pantograph).
const M_LAT = 111320;
function lengthOf(v) {
  const m = /(\d+(?:\.\d+)?)\s*m\b/.exec(v.model || '');
  return m ? Number(m[1]) : v.kind === 'streetcar' ? 30 : 12;
}
function vehicleParts(v, s) {
  const L = lengthOf(v) * s, W = (v.kind === 'streetcar' ? 2.65 : 2.55) * s, H = (v.kind === 'streetcar' ? 3.5 : 3.1) * s;
  const body = colorOf(v), glass = '#2b3641', n = L >= 26 ? 3 : L / s >= 16 ? 2 : 1, gap = n > 1 ? 0.9 * s : 0;
  const secL = (L - gap * (n - 1)) / n, parts = [];
  const box = (y0, y1, hw, b, h, c) => parts.push({ y0, y1, hw, b: b * s, h: h * s, c });
  for (let k = 0; k < n; k++) {
    const y0 = -L / 2 + k * (secL + gap), y1 = y0 + secL;
    box(y0, y1, W / 2, 0.35, 1.2, body);                              // lower body
    box(y0 + 0.1 * s, y1 - 0.1 * s, W / 2 - 0.07 * s, 1.2, 2.45, glass); // window band, slightly recessed
    box(y0, y1, W / 2, 2.45, H / s, body);                           // roof
    if (k < n - 1) box(y1, y1 + gap, W / 2 - 0.35 * s, 0.6, 3.0, '#1d1f23'); // articulation joint
  }
  box(L / 2 - 0.25 * s, L / 2, W / 2 - 0.25 * s, 1.9, 2.75, '#ffd54a');       // destination sign marks the front
  if (v.kind === 'streetcar') box(-L / 2 + secL * 0.5 - 0.6 * s, -L / 2 + secL * 0.5 + 0.6 * s, 0.6 * s, H / s, H / s + 0.7, '#8a8f98'); // pantograph
  return parts;
}
function build3D() {
  const z = map.getZoom(), s = Math.min(8, Math.max(1, 2 ** (17 - z)));  // grow at distance so they stay visible; true size from zoom 17
  const bnd = map.getBounds(), padLon = (bnd.getEast() - bnd.getWest()) * 0.15, padLat = (bnd.getNorth() - bnd.getSouth()) * 0.15;
  const feats = [];
  for (const [id, v] of vehicles) {
    if (!v.cur || !matches(v)) continue;
    const [lon, lat] = v.cur;
    if (lon < bnd.getWest() - padLon || lon > bnd.getEast() + padLon || lat < bnd.getSouth() - padLat || lat > bnd.getNorth() + padLat) continue;
    if (feats.length > 4000) break;
    const th = (v.bearing ?? 0) * Math.PI / 180, sn = Math.sin(th), cs = Math.cos(th), kLon = M_LAT * Math.cos(lat * Math.PI / 180);
    const pt = (x, y) => [lon + (x * cs + y * sn) / kLon, lat + (-x * sn + y * cs) / M_LAT]; // x = right of travel, y = forward
    for (const p of vehicleParts(v, s))

  for (const v of vehicles.values()) {
    if (metres(nearPt, v.cur) > nearR) continue;
    const kk = `${v.agency} ${v.kind === 'streetcar' ? 'streetcar' : 'bus'}`; by[kk] = (by[kk] || 0) + 1;
  }
  for (const v of vehicles.values()) {                                                // vehicles running on the route anywhere, and the closest one to you
    const kk = `${v.agency} ${shortOf(v)}`, d = metres(nearPt, v.cur), e = live.get(kk) ?? { n: 0, d: Infinity, pos: null };
    e.n++; if (d < e.d) { e.d = d; e.pos = v.cur; } live.set(kk, e);
  }
  const nIn = Object.values(by).reduce((x, y) => x + y, 0);
  nearBox.style.display = 'block';
  nearBox.innerHTML = `<button class="nx" data-nearclose title="Close">×</button><b>${nearRoutes.length}</b> route${nearRoutes.length === 1 ? '' : 's'} within
    <select id="nearR">${[250, 500, 1000, 2000].map(r => `<option value="${r}"${r === nearR ? ' selected' : ''}>${r >= 1000 ? r / 1000 + ' km' : r + ' m'}</option>`).join('')}</select>
    <div style="margin-top:3px;color:#99a">${nIn} vehicle${nIn === 1 ? '' : 's'} nearby now${Object.keys(by).length ? ': ' + Object.entries(by).map(([k, n]) => `${n} ${k}`).join(' · ') : ''}</div>` +
    (nearRoutes.map(r => {
      const i = routes[Object.keys(routes).find(id => routes[id].a === r.a && kOf(routes[id]) === r.k)] ?? null, lv = live.get(r.a + ' ' + r.k), n = lv?.n ?? 0;
      const col = i?.c ?? (r.a === 'YRT' ? '#14b8a6' : r.t === '0' ? '#da291c' : '#2b8cff');
      return `<button class="rt" data-nearroute="${esc(r.a + ' ' + r.k)}" ${lv ? `data-lon="${lv.pos[0]}" data-lat="${lv.pos[1]}"` : ''} title="${esc(i?.l ?? '')}"><span class="bd" style="background:${esc(col)}">${esc(r.a)} ${esc(r.k.toUpperCase())}</span><span class="nm">${esc(i?.l ?? '')}</span><small>${Math.round(r.d / 10) * 10} m away · ${n ? `${n} live, nearest ${lv.d < 1000 ? Math.round(lv.d / 10) * 10 + ' m' : (lv.d / 1000).toFixed(1) + ' km'}` : 'none live'}</small></button>`;
    }).join('') || '<div style="margin-top:6px;color:#99a">No routes pass within this radius.</div>') +
    (nearNote ? `<div style="margin-top:6px;color:#e6b800">${esc(nearNote)}</div>` : '');
}
nearBox.addEventListener('change', e => { if (e.target.id === 'nearR') { nearR = Number(e.target.value); updateNearby(); } });
nearBox.addEventListener('click', e => {
  if (e.target.closest('[data-nearclose]')) { nearBox.style.display = 'none'; nearPt = null; try { map.getSource('near').setData(EMPTY); } catch (x) {} return; }
  const b = e.target.closest('[data-nearroute]'); if (!b) return;
  const inp = document.getElementById('route'); inp.value = b.dataset.nearroute;
  fq = parseFilter(inp.value); applyFilter(); updateRoute(false); rebuildHist();
  if (b.dataset.lon) {                                  // frame you and the closest live vehicle of that route
    const v = [Number(b.dataset.lon), Number(b.dataset.lat)], bb = new maplibregl.LngLatBounds(nearPt, nearPt).extend(v);
    map.fitBounds(bb, { padding: { top: 90, right: 90, bottom: 110, left: 330 }, maxZoom: 16, duration: 800 });
  }
});
function goNearby(pt, note) {
  nearPt = pt; nearNote = note || ''; updateNearby();
  map.flyTo({ center: pt, zoom: nearR <= 500 ? 15.5 : 14.5, duration: 900 });
}
function locateMe(auto) {
  const centre = () => [map.getCenter().lng, map.getCenter().lat];
  if (!navigator.geolocation) return auto || goNearby(centre(), 'Location is not available in this browser, so the map centre is used.');
  navigator.geolocation.getCurrentPosition(
    p => goNearby([p.coords.longitude, p.coords.latitude]),
    err => auto || goNearby(centre(), 'Could not get your location (' + err.message + '), so the map centre is used.'),   // on load, stay quiet and keep the default view
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}
document.getElementById('nearBtn').onclick = () => locateMe(false);
map.once('load', () => locateMe(true));   // zoom to the user's location when the page first loads

document.getElementById('route').addEventListener('input', e => { fq = parseFilter(e.target.value); applyFilter(); updateRoute(true); rebuildHist(); });
document.getElementById('color').addEventListener('change', e => { colorMode = e.target.value; renderLegend(); rebuildHist(); });
document.getElementById('showBus').addEventListener('change', e => { typeOn.bus = e.target.checked; rebuildHist(); });
document.getElementById('showTram').addEventListener('change', e => { typeOn.streetcar = e.target.checked; rebuildHist(); });
document.getElementById('trails').addEventListener('change', e => { trailsOn = e.target.checked; rebuildHist(); });
setInterval(rebuildHist, 5000);
loadAlerts(); setInterval(loadAlerts, 60000);

document.getElementById('mode').addEventListener('click', e => {
  is3D = !is3D;
  e.target.textContent = is3D ? 'Switch to 2D' : 'Switch to 3D';
  if (is3D && map.getSource('openmaptiles') && !map.getLayer('bldg3d')) {
    map.addLayer({
      id: 'bldg3d', type: 'fill-extrusion', source: 'openmaptiles', 'source-layer': 'building', minzoom: 13,
      paint: {
        'fill-extrusion-color': '#c9ccd1', 'fill-extrusion-opacity': 0.85,
        'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 10],
        'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      },
    }, map.getLayer('lines') ? 'lines' : 'veh');
  }
  if (map.getLayer('bldg3d')) map.setLayoutProperty('bldg3d', 'visibility', is3D ? 'visible' : 'none');
  if (map.getLayer('veh-3d')) {
    map.setLayoutProperty('veh-3d', 'visibility', is3D && !useModels ? 'visible' : 'none');
    for (const L of ['veh', 'veh-dot']) map.setLayerZoomRange(L, 0, is3D ? MODEL_MIN_ZOOM : 24); // flat markers only until the 3D models appear
    if (!is3D) map.getSource('veh3d').setData(EMPTY);
  }
  map.easeTo({ pitch: is3D ? 60 : 0, bearing: is3D ? -20 : 0, zoom: is3D ? Math.max(map.getZoom(), 14) : map.getZoom(), duration: 1200 });
});

setInterval(() => {
  if (!ready) return;
  try {
    const n = map.queryRenderedFeatures({ layers: ['veh-dot'] }).length;
    let tram = 0, bus = 0;
    for (const v of vehicles.values()) v.kind === 'streetcar' ? tram++ : bus++;
    const bad = Object.entries(idTrust).filter(([, ok]) => ok === false).map(([a]) => a);
    document.getElementById('dbg').textContent = `zoom ${map.getZoom().toFixed(1)} · ${n} drawn in view\n${tram} streetcars · ${bus} buses`
      + (bad.length ? `\n${bad.join(', ')}: vehicle ids don't look like fleet numbers, typing by route instead` : '');
  } catch (e) { document.getElementById('dbg').textContent = 'draw check failed: ' + e.message; }
}, 2000);

renderLegend();
refresh(); setInterval(refresh, POLL_MS / 3);
render();
</script>
</body>
</html>
